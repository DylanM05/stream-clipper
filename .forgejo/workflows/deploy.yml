# Every push is built into the app's image and tested in it, and checked for secrets and risky code. If that passes, a
# push to main is deployed to the server (deploy/deploy.sh). Every push, and each week for newly found ones, the app's
# packages and images are also scanned for known vulnerabilities. That job doesn't hold up a deploy: the app that's
# running has them already, and a deploy may be what fixes them.
#
# It runs on a Forgejo runner whose ubuntu-latest jobs run in a container that uses the server's Docker, as Forgejo's
# runner sets them up by default. See "Automatic deploys" in the README.
name: Test and deploy

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # Mondays

jobs:
  check:
    name: Test and check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, for the secrets check
          persist-credentials: false

      - name: Build and test
        run: deploy/test.sh "$GITHUB_SHA"

      - name: Secrets
        if: ${{ !cancelled() }}
        run: deploy/scan.sh secrets

      - name: Code
        if: ${{ !cancelled() }}
        run: deploy/scan.sh code

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Packages and images
        run: deploy/scan.sh vulnerabilities

  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to the server
        env:
          DEPLOY_DIR: ${{ vars.CLIPPER_DEPLOY_DIR }}
        run: deploy/ci-deploy.sh "$DEPLOY_DIR" "$GITHUB_SHA"
